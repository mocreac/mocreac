        <style>
            /* ────────── Design tokens (mirrors homepage) ────────── */
            :root {
                --sand-50:  #FAFAFA;
                --sand-100: #F5F5F5;
                --sand-200: #E6E6E6;
                --sand-300: #D3D3D3;
                --sand-400: #A3A3A3;
                --sand-500: #646464;
                --sand-600: #535353;
                --sand-700: #404040;
                --sand-800: #272727;
                --sand-900: #1A1A1A;
                --sand-950: #0B0B0B;
            }

            html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
            body {
                font-family: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                letter-spacing: -0.02em;
            }
            .font-bold, .font-extrabold, .font-black { font-weight: 600 !important; }
            .tnum { font-variant-numeric: tabular-nums; }
            h1, h2, h3 { text-wrap: balance; }
            p { text-wrap: pretty; }

            /* ────────── Pills (mirrors homepage) ────────── */
            .pill {
                display: inline-flex;
                align-items: center;
                padding: 10px 20px;
                border-radius: 999px;
                font-weight: 500;
                font-size: 14px;
                transition:
                    transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
                    background-color 220ms ease,
                    box-shadow 220ms ease;
            }
            .pill:hover { transform: translateY(-1px); }
            .pill-primary { background: #000; color: white; }
            .pill-primary:hover { background: var(--sand-900); box-shadow: 0 8px 20px -8px rgba(0,0,0,0.45); }
            .pill-secondary { background-color: var(--sand-200); color: rgb(17 24 39); }
            .pill-secondary:hover { background-color: var(--sand-300); }

            /* ────────── Layout ────────── */
            .shell {
                max-width: 960px;
                margin: 0 auto;
                padding: 8px 24px 80px 24px;
                width: 100%;
            }

            /* ────────── Category tabs ────────── */
            .tabs {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin: 4px 0 28px;
            }
            .tab {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: white;
                border: 1px solid var(--sand-300);
                color: var(--sand-700);
                border-radius: 999px;
                padding: 8px 14px;
                font-size: 13.5px;
                font-weight: 500;
                cursor: pointer;
                user-select: none;
                transition:
                    background-color 180ms cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 180ms cubic-bezier(0.16, 1, 0.3, 1),
                    color 180ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
                -webkit-tap-highlight-color: transparent;
                line-height: 1;
            }
            .tab:hover { border-color: var(--sand-500); color: var(--sand-900); }
            .tab:active { transform: scale(0.96); }
            .tab.is-active {
                background: var(--sand-900);
                border-color: var(--sand-900);
                color: white;
            }
            .tab.is-active .tab-count { color: var(--sand-400); }
            .tab-count {
                color: var(--sand-400);
                font-size: 12px;
                font-weight: 500;
            }

            /* ────────── Grid ────────── */
            .notes-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                grid-auto-rows: 1px;
                column-gap: 16px;
            }
            @media (min-width: 640px) {
                .notes-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            }

            /* ────────── Card ────────── */
            .curation-card {
                position: relative;
                break-inside: avoid;
                min-width: 0;
                background: white;
                border-radius: 22px;
                padding: 8px;
                display: flex;
                flex-direction: column;
                text-decoration: none;
                color: inherit;
                box-shadow:
                    0 0 0 1px rgba(11, 11, 11, 0.05),
                    0 1px 2px rgba(11, 11, 11, 0.03);
                transition:
                    transform 460ms cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 460ms cubic-bezier(0.16, 1, 0.3, 1);

            }
            @media (hover: hover) {
                .curation-card[href]:hover {
                    transform: translateY(-6px);
                    box-shadow:
                        0 0 0 1px rgba(11, 11, 11, 0.06),
                        0 1px 2px rgba(11, 11, 11, 0.04),
                        0 24px 56px -20px rgba(11, 11, 11, 0.22);
                }
                .curation-card:hover .curation-banner img {
                    transform: scale(1.04);
                }
                .curation-card:hover .curation-arrow {
                    transform: translate(3px, -3px);
                    color: var(--sand-900);
                }
            }

            /* OG image banner. 1.91:1 matches the canonical OG aspect ratio
               (1200×630), so images render edge-to-edge without cropping.
               Sits inside the card's padding for a framed look. */
            .curation-banner {
                position: relative;
                width: 100%;
                aspect-ratio: 1.91 / 1;
                background-color: var(--sand-100);
                border-radius: 14px;
                overflow: hidden;
                box-shadow: inset 0 0 0 1px rgba(11, 11, 11, 0.04);
            }
            .curation-banner img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 620ms cubic-bezier(0.16, 1, 0.3, 1);
            }
            /* If the OG image fails to load, hide the broken image and
               leave the patterned placeholder background visible. */
            .curation-card.banner-failed .curation-banner img { display: none; }

            .curation-meta {
                padding: 14px 10px 8px;
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 12px;
            }
            .curation-text {
                display: flex;
                flex-direction: column;
                gap: 3px;
                min-width: 0;
            }
            .curation-title {
                font-size: 15px;
                font-weight: 600;
                color: var(--sand-900);
                line-height: 1.3;
            }
            .curation-source-label {
                font-size: 12.5px;
                color: var(--sand-500);
                font-weight: 500;
            }
            .curation-arrow {
                color: var(--sand-400);
                flex-shrink: 0;
                margin-top: 4px;
                transition:
                    transform 360ms cubic-bezier(0.16, 1, 0.3, 1),
                    color 220ms ease;
            }

            .notes-intro { color: var(--sand-500); font-size: 14px; margin: 6px 0 24px; }
            .notes-grid { align-items: start; }
            .note-content { padding: 18px 14px 14px; }
            .note-kind { display: block; font-size: 11px; color: var(--sand-500); margin-bottom: 10px; }
            .note-content h2 { font-size: 18px; font-weight: 600; line-height: 1.3; margin-bottom: 10px; }
            .note-description { color: var(--sand-600); font-size: 13px; line-height: 1.65; margin-top: 10px; }
            .note-description code { font-size: 12px; }
            .formula { display: flex; align-items: center; justify-content: center; gap: 5px; font: 28px Georgia, serif; padding: 24px 0 10px; }
            .fraction { display: inline-flex; flex-direction: column; text-align: center; font-size: 20px; line-height: 1.2; }
            .fraction span:first-child { border-bottom: 1px solid currentColor; padding: 0 5px 2px; }
            .corner-diagrams { display: grid; grid-template-columns: 1fr 1fr; background: var(--sand-100); border-radius: 14px; padding: 10px; margin-inline: 14px; }
            .corner-diagrams svg { width: 100%; height: auto; color: var(--sand-800); }
            .math-handle, .corner-diagrams text { user-select: none; -webkit-user-select: none; }
            .corner-diagrams .diagram-math { font: italic 17px Georgia, "Times New Roman", serif; }
            .corner-diagrams .diagram-math { transition: fill 180ms ease-out; }
            .corner-diagrams .diagram-math.is-active { fill: var(--sand-800); }
            .number-field > span { user-select: none; -webkit-user-select: none; }
            .corner-diagrams text { font: 11px Onest, sans-serif; fill: var(--sand-500); }
            .note-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
            .number-field { display: flex; align-items: center; gap: 0; min-width: 0; background: var(--sand-100); border-radius: 10px; padding: 8px 6px; color: var(--sand-600); font-size: 12px; }
            .number-field input:focus-visible, .number-field .scrub-handle:focus-visible { outline: none; }
            .number-field:focus-within { box-shadow: 0 0 0 2px var(--sand-300); }
            .number-field input { width: 2ch; flex: 0 1 auto; min-width: 0; outline: none; background: transparent; color: var(--sand-900); font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; appearance: textfield; -moz-appearance: textfield; }
            .number-field input::-webkit-inner-spin-button, .number-field input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
            .scrub-handle { display: grid; place-items: center; flex-shrink: 0; width: 26px; height: 36px; margin: -4px 3px -4px -4px; cursor: ew-resize; touch-action: none; }
            .corner-diagrams [data-angle-dial] { border-radius: 10px; }
            .angle-rail, .angle-tick, .corner-stroke, .result-radius-line { pointer-events: none; }
            .angle-tick { transform: scale(var(--tick-density, 1)) scaleY(var(--tick-scale, 1)); transform-origin: 0 0; transition: transform 300ms cubic-bezier(.22, 1, .36, 1), stroke 220ms ease-out; }
            .angle-hit { pointer-events: stroke; }
            .corner-diagrams [data-angle-handle] { cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent; }
            .corner-diagrams [data-angle-handle]:active { cursor: grabbing; }
            .corner-diagrams [data-angle-dial]:focus,
            .corner-diagrams [data-angle-handle]:focus,
            .corner-diagrams [data-angle-handle]:focus-visible { outline: none !important; box-shadow: none; }
            @media (prefers-reduced-motion: reduce) { .angle-tick, .tick-slot { transition: none; } }
            .math-handle { font: italic 17px Georgia, "Times New Roman", serif; color: var(--sand-600); }
            .corner-diagrams [data-angle-dial] { -webkit-tap-highlight-color: transparent; }
            .prompt-card { padding: 22px; }
            .prompt-card .note-content { padding: 0; }
            .prompt-card .code-block { margin-top: 18px; }
            .copy-feedback:empty { display: none; }
            @media (max-width: 400px) {
                .number-field, .number-field input { font-size: 11px; }
                .scrub-handle { width: 22px; }
                .scrub-handle svg { width: 16px; height: 16px; }
            }
            .radius-result { display: block; margin-top: 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
            .code-block { background: var(--sand-100); border-radius: 14px; padding: 20px 16px; font: 12px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-x: auto; scrollbar-width: thin; scrollbar-color: gray transparent; }
            .note-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 18px; }
            .note-source { font-size: 12px; color: var(--sand-500); text-decoration: underline; text-underline-offset: 3px; }
            .copy-button { border: 1px solid var(--sand-300); border-radius: 999px; padding: 8px 12px; font-size: 12px; cursor: pointer; background: white; }
            .copy-button:active { transform: scale(0.96); }
            .copy-feedback { font-size: 12px; color: var(--sand-600); margin-top: 8px; }
            .resource-preview { display: flex; flex-direction: column; justify-content: center; padding: 28px; }
            .resource-preview strong { font-size: clamp(24px, 4vw, 36px); font-weight: 500; letter-spacing: -0.06em; }
            .resource-preview span { font-size: 12px; color: var(--sand-500); margin-top: 6px; }
            .curation-description { padding: 0 10px 10px; font-size: 13px; line-height: 1.6; color: var(--sand-600); }
            a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--sand-700); outline-offset: 4px; }
            @media (prefers-reduced-motion: reduce) {
                .curation-card, .curation-banner img, .curation-arrow, .tab, .pill { transition: none; }
                .curation-card[href]:hover { transform: none; }
            }

            /* ────────── Empty state ────────── */
            .empty-state {
                display: none;
                text-align: center;
                padding: 64px 20px;
                color: var(--sand-500);
                font-size: 14px;
            }
            /* Focus visible polish */
            .pill:focus-visible,
            .tab:focus-visible { box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.12); }

            /* ────────── Online status ────────── */
            .online-status {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                font-size: 12px;
                font-weight: 500;
                color: var(--sand-500);
                line-height: 1;
                letter-spacing: -0.02em;
            }
            .online-status-dot {
                width: 8px;
                height: 8px;
                border-radius: 999px;
                background: var(--sand-400);
                box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.18);
                flex-shrink: 0;
                transition: background 240ms ease, box-shadow 240ms ease;
            }
            .online-status[data-status="online"] .online-status-dot {
                background: #22C55E;
                box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.22);
                animation: online-pulse 2.4s ease-in-out infinite;
            }
            @keyframes online-pulse {
                0%, 100% { box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.22); }
                50%      { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.06); }
            }
            @media (prefers-reduced-motion: reduce) {
                .online-status-dot { animation: none !important; }
            }

            /* ────────── Mobile (≤640px) ──────────
               24px header/footer frame (consistent across pages); the card grid
               island sits wider at 12px. The grid already collapses to a single
               column below 640px. */
            @media (max-width: 640px) {
                header, footer { padding-left: 24px; padding-right: 24px; }
                .shell { padding-left: 12px; padding-right: 12px; }
                body { overflow-x: clip; }
            }
        </style>
        <link rel="stylesheet" href="/src/corners.css" />
    </head>
    <body class="bg-[var(--sand-50)] text-gray-900 min-h-screen flex flex-col">
        <header class="py-6 flex items-center gap-4 max-w-[912px] w-full mx-auto">
            <a href="/" class="inline-flex shrink-0" aria-label="George Mocreac — Home">
                <img src="/logo.svg" alt="George Mocreac" class="shrink-0 w-[2.97rem] h-[2.97rem] sm:w-[3.7125rem] sm:h-[3.7125rem]" />
            </a>
            <div>
                <p class="text-2xl sm:text-3xl font-semibold leading-[1.1] tracking-[-0.06em] text-[#858585]">George Mocreac</p>
                <h1 class="text-2xl sm:text-3xl font-semibold leading-[1.1] tracking-[-0.06em] text-[var(--sand-900)]">Notes</h1>
            </div>
        </header>
        <main class="flex-1 w-full">
            <div class="shell">
                <!-- Category tabs -->
                <div class="tabs" id="category-tabs" role="group" aria-label="Filter by category"></div>

                <!-- Grid -->
                <section>
                    <div class="notes-grid" id="notes-grid"></div>
                    <div class="empty-state" id="empty-state">
                        Nothing in this category yet — check back soon.
                    </div>
                </section>
            </div>
        </main>

        <footer class="py-6 mt-16 flex items-center text-xs text-[var(--sand-700)] max-w-[912px] w-full mx-auto">
            <div class="flex w-full items-center justify-between gap-3">
                <span class="tnum">© 2026 George Mocreac</span>
                <span class="online-status">
                    <span class="online-status-dot" aria-hidden="true"></span>
                    <span class="online-status-text">Checking…</span>
                </span>
            </div>
        </footer>

        <script type="module" src="/src/notes.ts"></script>
    </body>
</html>
